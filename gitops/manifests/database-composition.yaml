apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: database-kubernetes
spec:
  compositeTypeRef:
    apiVersion: idp-local.dev/v1alpha1
    kind: XDatabase
  mode: Pipeline
  pipeline:
    - step: create-objects
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: default
                    data:
                      connectionString: postgres://fake-db:5432/app
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-config"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.size
                toFieldPath: spec.forProvider.manifest.data.size
          - name: deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      namespace: default
                    spec:
                      replicas: 1
                      selector:
                        matchLabels:
                          app: placeholder
                      template:
                        metadata:
                          labels:
                            app: placeholder
                        spec:
                          containers:
                            - name: fake-db
                              image: postgres:16-alpine
                              env:
                                - name: POSTGRES_PASSWORD
                                  value: fake-password
                              ports:
                                - containerPort: 5432
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels.app
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels.app
