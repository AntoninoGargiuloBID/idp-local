apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-claims
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AntoninoGargiuloBID/idp-local.git
    targetRevision: main
    path: gitops/claims
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
