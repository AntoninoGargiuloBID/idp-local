apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provider-kubernetes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AntoninoGargiuloBID/idp-local.git
    targetRevision: main
    path: gitops/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
